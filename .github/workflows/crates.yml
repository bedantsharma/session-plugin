name: crates.io

# Publishes the two crates on a release tag: the core library first, then the program that
# depends on it. Needs the Actions secret CARGO_REGISTRY_TOKEN (see docs/RELEASING.md).
# Prerelease tags (v0.1.0-rc.1) are skipped: a crates.io version can never be taken back.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      # No web build here on purpose: the crates carry no dashboard, so the program built
      # from crates.io serves a page that says how to build it (spec §16.3); the JSON API
      # works either way. Binaries from the GitHub Release and PyPI embed the dashboard.
      - name: Check both crates package and build
        run: cargo package --workspace
      - name: Publish bridge-screen-core
        run: cargo publish -p bridge-screen-core
      # cargo waits for the index after an upload; the retries cover a slow index.
      - name: Publish bridge-screen
        run: |
          for attempt in 1 2 3 4 5 6; do
            if cargo publish -p bridge-screen; then exit 0; fi
            echo "attempt $attempt failed; waiting for the crates.io index"
            sleep 30
          done
          exit 1
