[package]
name = "bridge-screen"
description = "Keeps track of where your Claude Code agents are: progress, tangents, and handoffs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
bridge-screen-core = { path = "../bridge-screen-core" }
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
rmcp = { version = "3.5.1", features = ["server", "macros", "schemars", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3.27.0"
