[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "bridge-screen"
description = "Keeps track of where your Claude Code agents are: progress, tangents, and handoffs."
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust", "Environment :: Console"]
dynamic = ["version"]

[tool.maturin]
bindings = "bin"
