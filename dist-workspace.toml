[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "homebrew", "npm"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
tap = "bedantsharma/homebrew-tap"
publish-jobs = ["homebrew", "npm"]
install-path = "CARGO_HOME"
install-updater = false
# Build the dashboard before the Rust build so it is embedded (spec §16.3).
github-build-setup = "../build-setup.yml"

# GitHub retired the macos-14 runner dist picks by default for Apple Silicon (v0.2.0's build was cancelled).
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
